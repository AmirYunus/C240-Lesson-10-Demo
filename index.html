<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app" aria-labelledby="app-title">
      <header class="app-header">
        <h1 id="app-title">Pomodoro Timer</h1>
      </header>

      <section class="timer-panel" aria-label="Timer panel">
        <div class="progress-container" aria-hidden="true">
          <svg class="progress-ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle
              id="progress-ring-track"
              class="progress-ring-track"
              cx="60"
              cy="60"
              r="54"
            ></circle>
            <circle
              id="progress-ring-fill"
              class="progress-ring-fill"
              cx="60"
              cy="60"
              r="54"
              stroke-dasharray="339.292"
              stroke-dashoffset="339.292"
            ></circle>
          </svg>
          <div class="timer-display" role="status" aria-live="polite">
            <span id="timer-value">25:00</span>
            <span class="phase-label" id="phase-label">Work</span>
          </div>
        </div>
        <p class="session-inline">Sessions: <span id="session-count">0</span></p>
      </section>

      <section class="controls" aria-label="Timer controls">
        <button id="pause-btn" type="button" hidden>Pause</button>
        <button id="reset-btn" type="button">Start</button>
        <button id="reset-sessions-btn" type="button">Reset sessions</button>
      </section>
    </main>
  </body>
</html>
